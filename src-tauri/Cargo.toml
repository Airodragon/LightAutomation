[package]
name = "lights-studio"
version = "0.2.0"
description = "Lights Studio — home hub for lights, plugs and more"
authors = ["airodragon"]
edition = "2021"
default-run = "lights-studio"

[lib]
name = "lights_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
axum = "0.8"
include_dir = "0.7"
mdns-sd = "0.11"
ureq = { version = "2", features = ["json"] }
native-tls = "0.2"
media-remote = { version = "0.5", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
